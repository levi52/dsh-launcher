    <g transform="translate(38,96)">
      <circle cx="46" cy="46" r="40" fill="none" stroke="#3ddc97" stroke-opacity=".3"/>
      <circle cx="46" cy="46" r="30" fill="none" stroke="#3ddc97" stroke-opacity=".2"/>
      <circle cx="46" cy="46" r="11" fill="#3ddc97"/>
