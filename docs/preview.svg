    <text x="52" y="284" font-family="Segoe UI, Arial" font-size="14" font-weight="600" fill="#d9ecf9">▶ 启动服务 START</text>
    <rect x="218" y="256" width="192" height="46" rx="9" fill="#0d1420" fill-opacity=".8" stroke="#3a4a5a"/>
    <text x="250" y="284" font-family="Segoe UI, Arial" font-size="14" font-weight="600" fill="#556677">■ 停止服务 STOP</text>
    <rect x="20" y="314" width="390" height="42" rx="9" fill="#081422" stroke="#3a4a5a" stroke-dasharray="6 4"/>
    <text x="60" y="340" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#8fb8cc">↗ 打开界面 OPEN</text>

