    <text x="24" y="30" font-family="Segoe UI, Arial" font-size="13" font-weight="600" fill="#3ee0ff">◉ 实时日志</text>
    <text x="130" y="30" font-family="Segoe UI, Arial" font-size="13" fill="#556677">⚡ 快捷任务</text>
    <text x="238" y="30" font-family="Segoe UI, Arial" font-size="13" fill="#556677">☰ 会话</text>
    <text x="300" y="30" font-family="Segoe UI, Arial" font-size="13" fill="#556677">⚙ 设置</text>
    <rect x="24" y="38" width="82" height="2" fill="#3ee0ff"/>

    <!-- 日志区 -->
    <rect x="20" y="52" width="706" height="568" rx="8" fill="#02060c" fill-opacity=".85" stroke="#2a5a7a" stroke-opacity=".5"/>
    <g font-family="Consolas, monospace" font-size="12">
      <text x="36" y="80" fill="#4a6b85">[21:04:12]</text>
      <text x="112" y="80" fill="#3ee0ff">SYS</text>
      <text x="156" y="80" fill="#8ff2ff">[启动] dsh web · pid=2841 · port=3080 · host=127.0.0.1</text>
      <text x="36" y="102" fill="#4a6b85">[21:04:13]</text>
      <text x="112" y="102" fill="#3ee0ff">SYS</text>
      <text x="156" y="102" fill="#8ff2ff">[启动] 命令: node …\@deepseek-ai\dsh\lib\bin.js --profile web --port 3080</text>
      <text x="36" y="124" fill="#4a6b85">[21:04:14]</text>
      <text x="112" y="124" fill="#3ddc97">OUT</text>
      <text x="156" y="124" fill="#cfe9f7">[dsh] 正在组合 profile 配置层…</text>
      <text x="36" y="146" fill="#4a6b85">[21:04:15]</text>
      <text x="112" y="146" fill="#3ddc97">OUT</text>
      <text x="156" y="146" fill="#cfe9f7">[dsh] web 服务已绑定 http://127.0.0.1:3080</text>
      <text x="36" y="168" fill="#4a6b85">[21:04:16]</text>
      <text x="112" y="168" fill="#3ee0ff">SYS</text>
      <text x="156" y="168" fill="#8ff2ff">[就绪] GUI 已响应，自动打开浏览器 http://127.0.0.1:3080</text>
      <text x="36" y="196" fill="#4a6b85">[21:04:21]</text>
      <text x="112" y="196" fill="#ff9d9d">ERR</text>
      <text x="156" y="196" fill="#ffc9c9">[warning] 会话索引为内存模式（:memory:），重启后不可检索</text>
    </g>
  </g>

  <!-- 底部 -->
  <line x1="0" y1="776" x2="1280" y2="776" stroke="#2a5a7a" stroke-opacity=".5"/>
  <text x="40" y="794" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#4a6b85">DSH LAUNCHER · 深海控制台</text>
  <text x="1080" y="794" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#4a6b85">Ctrl+C 退出后端 · 不会影响已运行的 GUI</text>
</svg>
