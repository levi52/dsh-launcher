<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06101d"/>
      <stop offset="1" stop-color="#02060c"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0e5a8c" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".9"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#bg)" opacity="0"/>
  <g opacity=".06">
    <path d="M0 120 H1280 M0 240 H1280 M0 360 H1280 M0 480 H1280 M0 600 H1280 M0 720 H1280" stroke="#4fbfff"/>
    <path d="M160 0 V800 M320 0 V800 M480 0 V800 M640 0 V800 M800 0 V800 M960 0 V800 M1120 0 V800" stroke="#4fbfff"/>
  </g>

  <!-- 顶部栏 -->
  <rect x="0" y="0" width="1280" height="86" fill="#06101d" opacity=".9"/>
  <line x1="0" y1="86" x2="1280" y2="86" stroke="#2a5a7a" stroke-opacity=".5"/>

  <!-- 鲸鱼标志 -->
  <g transform="translate(48,16)">
    <circle cx="40" cy="30" r="36" fill="none" stroke="#3ee0ff" stroke-opacity=".25"/>
    <circle cx="40" cy="30" r="36" fill="none" stroke="#3ee0ff" stroke-opacity=".15" transform="scale(1.25)" transform-origin="40 30"/>
    <path d="M10 34 C12 25 22 20 34 22 C46 24 55 30 58 35 C58 39 51 42 42 42 C31 42 21 38 15 35 C11 33 9 35 10 34 Z" fill="url(#whale)"/>
    <path d="M58 35 C63 31 65 33 63 35 C65 37 63 39 58 35 Z" fill="url(#whale)"/>
    <circle cx="16" cy="32" r="1.6" fill="#06121f"/>
    <path d="M11 30 C9 26 11 23 15 21" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
  <text x="150" y="38" font-family="Segoe UI, Arial" font-size="24" font-weight="700" letter-spacing="4" fill="#d9ecf9">DEEPSEEK <tspan fill="#3ee0ff">HARNESS</tspan></text>
  <text x="152" y="62" font-family="Consolas, monospace" font-size="10" letter-spacing="5" fill="#4a6b85">启动器 · LAUNCHER CONSOLE</text>

  <g transform="translate(1010,26)">
    <rect width="120" height="34" rx="17" fill="#0a1a2c" stroke="#2a5a7a"/>
    <circle cx="24" cy="17" r="5" fill="#3ddc97"/>
    <text x="38" y="22" font-family="Consolas, monospace" font-size="11" fill="#d9ecf9">GUI 在线</text>
  </g>
  <g transform="translate(1142,26)">
    <rect width="110" height="34" rx="17" fill="#0a1a2c" stroke="#2a5a7a"/>
    <text x="16" y="22" font-family="Consolas, monospace" font-size="11" fill="#7d9cb5">LAUNCHER</text>
    <text x="78" y="22" font-family="Consolas, monospace" font-size="11" fill="#8ff2ff">v1.0</text>
  </g>

