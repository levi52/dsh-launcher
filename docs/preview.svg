    <rect width="746" height="640" rx="10" fill="#0a1a2c" fill-opacity=".6" stroke="#2a5a7a" stroke-opacity=".6"/>
    <path d="M0 10 Q0 0 10 0 H42 V14 H12 Q4 14 4 22 Z" fill="#3ee0ff" opacity=".8"/>
    <path d="M746 10 Q746 0 736 0 H704 V14 H734 Q742 14 742 22 Z" fill="#3ee0ff" opacity=".8"/>
    <path d="M0 630 Q0 640 10 640 H42 V626 H12 Q4 626 4 618 Z" fill="#3ee0ff" opacity=".8"/>
    <path d="M746 630 Q746 640 736 640 H704 V626 H734 Q742 626 742 618 Z" fill="#3ee0ff" opacity=".8"/>

