      <text x="12" y="18" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#4a6b85">DSH 版本</text>
      <text x="12" y="38" font-family="Consolas, monospace" font-size="12" fill="#d9ecf9">0.1.0-rc.6</text>
      <rect x="197" width="193" height="52" rx="7" fill="#06101d" stroke="#2a5a7a"/>
      <text x="209" y="18" font-family="Consolas, monospace" font-size="9" letter-spacing="2" fill="#4a6b85">DSH_HOME</text>
      <text x="209" y="38" font-family="Consolas, monospace" font-size="11" fill="#7d9cb5">C:\Users\&lt;you&gt;\.dsh</text>
    </g>
  </g>

  <!-- 右面板：日志 -->
